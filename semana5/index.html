<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semana 5 - Consumo de APIs</title>
    <style>
        body { 
            font-family: sans-serif; 
            margin: 20px; 
            background-color: #f9f9f9;
        }
        .container { 
            display: flex; 
            flex-wrap: wrap;
            gap: 40px; 
        }
        .app-section { 
            background: #fff;
            border: 1px solid #ddd; 
            padding: 20px; 
            border-radius: 8px; 
            width: 350px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        h2 { margin-top: 0; color: #333; }
        .status { margin-top: 10px; font-weight: bold; color: #0066cc; }
        .status.error { color: #cc0000; }
        dl { margin: 15px 0; }
        dt { font-weight: bold; margin-top: 8px; color: #555; }
        dd { margin-left: 0; margin-bottom: 5px; color: #222; }
        input[type="text"] {
            padding: 8px;
            width: 70%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        .pokemon-img { 
            max-width: 150px; 
            display: block;
            margin: 10px 0;
            background: #f0f0f0;
            border-radius: 50%;
        }
        .historico-lista { 
            list-style-type: none; 
            padding: 0; 
            max-height: 150px;
            overflow-y: auto;
        }
        .historico-lista li { 
            background: #eee; 
            margin-bottom: 5px; 
            padding: 8px; 
            border-radius: 4px; 
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Exercícios da Semana 5</h1>
    <p>Verifique o <strong>console (F12)</strong> para ver o resultado da <strong>Parte 1</strong> (Manipulação de Dados).</p>

    <div class="container">
        <!-- Parte 2: Buscador de CEP -->
        <div class="app-section">
            <h2>Buscador de CEP</h2>
            <form id="form-cep">
                <input type="text" id="input-cep" placeholder="Digite o CEP (ex: 01001000)" maxlength="9">
                <button type="submit" id="btn-cep">Buscar</button>
            </form>
            <div id="status-cep" class="status"></div>
            
            <dl id="resultado-cep"></dl>
            
            <h3>Histórico de Buscas</h3>
            <ul id="historico-cep" class="historico-lista"></ul>
        </div>

        <!-- Parte 3: Mini Pokédex -->
        <div class="app-section">
            <h2>Mini Pokédex</h2>
            <form id="form-pokemon">
                <input type="text" id="input-pokemon" placeholder="Ex: pikachu, charizard">
                <button type="submit" id="btn-pokemon">Buscar</button>
            </form>
            <div id="status-pokemon" class="status"></div>
            
            <div id="resultado-pokemon"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
